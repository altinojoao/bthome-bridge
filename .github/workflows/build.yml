name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK de debug
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK (artifact de build, todos os pushes)
        uses: actions/upload-artifact@v4
        with:
          name: blugateway-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # So corre quando o push e' de uma tag v* (ex: v1.0.24) -- cria
      # a release se ainda nao existir, e anexa o APK como asset
      # diretamente a partir do runner do GitHub. Isto substitui o
      # passo manual de descarregar o artifact e arrastar o ficheiro
      # para a pagina de releases: o proprio CI publica o APK onde a
      # app (e qualquer pessoa) o pode descarregar sem autenticacao.
      - name: Publicar release com APK anexado
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true

      # Em pushes ao main (ou execucao manual) publica tambem a release
      # v<versionName> -- cria a tag sobre este commit e anexa o APK,
      # sem depender de empurrar tags manualmente. Nao apaga nada.
      - name: Ler versao do build.gradle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: versao
        run: echo "nome=$(grep -m1 -E '^\s*versionName "' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      # A release da versao atual e' recriada a cada push (so esta
      # versao; as outras nao sao tocadas), para apontar sempre ao
      # commit mais recente do main.
      - name: Recriar release da versao atual
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "v${{ steps.versao.outputs.nome }}" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

      - name: Publicar release da versao atual
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.nome }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
