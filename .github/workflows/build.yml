name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK de debug
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee /tmp/build-output.log
        continue-on-error: true

      - name: Diagnostico -- publicar erro como annotation
        if: steps.build.outcome == 'failure'
        run: |
          ERRO=$(grep -B2 -A20 "^e: \|FAILURE: Build failed\|: error:" /tmp/build-output.log | head -c 3000)
          if [ -z "$ERRO" ]; then ERRO=$(tail -c 3000 /tmp/build-output.log); fi
          ERRO_ESC=$(echo "$ERRO" | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Erro de compilacao::${ERRO_ESC}"

      - name: Falhar o job se a compilacao falhou
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Publicar APK (artifact de build, todos os pushes)
        uses: actions/upload-artifact@v4
        with:
          name: bthome-bridge-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # So corre quando o push e' de uma tag v* (ex: v1.0.24) -- cria
      # a release se ainda nao existir, e anexa o APK como asset
      # diretamente a partir do runner do GitHub. Isto substitui o
      # passo manual de descarregar o artifact e arrastar o ficheiro
      # para a pagina de releases: o proprio CI publica o APK onde a
      # app (e qualquer pessoa) o pode descarregar sem autenticacao.
      - name: Publicar release com APK anexado
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
