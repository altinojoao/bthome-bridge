plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'pt.blugateway'
    compileSdk 34

    defaultConfig {
        applicationId "pt.blugateway.dev"
        minSdk 26
        targetSdk 34
        // O Android so reconhece um APK como "atualizacao" (preservando
        // dados locais) se versionCode for MAIOR que o ja instalado --
        // caso contrario recusa a instalacao (FAILED_VERSION_DOWNGRADE)
        // e obriga a desinstalar primeiro, perdendo tudo. Incrementar
        // SEMPRE a cada release, mesmo que o numero visivel (versionName)
        // pareca so um "patch". Historico: v1.0.0/v1.0.1 saíram as
        // duas com versionCode 1 (erro corrigido na v1.0.2). A v1.0.2
        // tambem foi a primeira com a keystore de debug fixa -- a
        // v1.0.3 e a primeira atualizacao real desse mecanismo,
        // instalando por cima da v1.0.2 sem perder dados.
        versionCode 23
        versionName "1.0.19"
    }

    signingConfigs {
        debug {
            // Chave de debug FIXA, comprometida no repositorio
            // (app/debug.keystore) -- nao a chave automatica que o
            // Android Gradle Plugin gera em ~/.android/debug.keystore,
            // que e diferente em CADA execucao de uma maquina limpa
            // como o GitHub Actions. Sem isto, cada build teria uma
            // assinatura diferente e o Android recusaria qualquer
            // atualizacao (INSTALL_FAILED_UPDATE_INCOMPATIBLE),
            // obrigando sempre a desinstalar antes de reinstalar.
            // Credenciais padrao/publicas do debug keystore do Android
            // (nao e segredo -- e a mesma senha "android" usada por
            // omissao em todo o ecossistema Android).
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.foundation:foundation-layout'
    implementation 'androidx.compose.material3:material3'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
