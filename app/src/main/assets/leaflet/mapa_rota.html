<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #mapa { height: 100%; background: #0D1117; }
    .leaflet-control-attribution { font-size: 9px; }
    #botoes-alternativas {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .btn-alt {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      text-align: left;
    }
  </style>
</head>
<body>
  <div id="mapa"></div>
  <div id="botoes-alternativas"></div>
  <script src="leaflet.js"></script>
  <script>
    var mapa = L.map('mapa', { zoomControl: true }).setView([0, 0], 2);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(mapa);

    setTimeout(function () { mapa.invalidateSize(); }, 100);

    var marcadorOrigem = null;
    var marcadorDestino = null;
    var camadasAlternativas = [];
    var alternativasActuais = [];

    var ICONE_ORIGEM = L.divIcon({
      html: '<div style="width:16px;height:16px;border-radius:50%;background:#3FB950;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.5)"></div>',
      className: '', iconSize: [16, 16], iconAnchor: [8, 8]
    });
    var ICONE_DESTINO = L.divIcon({
      html: '<div style="width:16px;height:16px;border-radius:50%;background:#E0522B;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.5)"></div>',
      className: '', iconSize: [16, 16], iconAnchor: [8, 8]
    });

    var CORES = ['#2BA6E0', '#9C6ADE', '#E0A62B'];

    function centraNaLocalizacao(lat, lon, zoom) {
      mapa.setView([lat, lon], zoom || 14);
    }

    function limpaPontos() {
      if (marcadorOrigem) { mapa.removeLayer(marcadorOrigem); marcadorOrigem = null; }
      if (marcadorDestino) { mapa.removeLayer(marcadorDestino); marcadorDestino = null; }
      limpaAlternativas();
    }

    function limpaAlternativas() {
      camadasAlternativas.forEach(function (c) { mapa.removeLayer(c); });
      camadasAlternativas = [];
      alternativasActuais = [];
      document.getElementById('botoes-alternativas').innerHTML = '';
    }

    function escolheAlternativa(indice) {
      window.location.href = 'blugateway-rota://escolhe?indice=' + indice;
    }

    function desenhaAlternativas(jsonTexto) {
      limpaAlternativas();
      var alternativas;
      try { alternativas = JSON.parse(jsonTexto); } catch (e) { return; }
      alternativasActuais = alternativas;

      var todosPontos = [];
      var container = document.getElementById('botoes-alternativas');

      alternativas.forEach(function (alt, indice) {
        var latLngs = alt.pontos.map(function (p) { return [p.lat, p.lon]; });
        todosPontos = todosPontos.concat(latLngs);
        var cor = CORES[indice % CORES.length];

        var linha = L.polyline(latLngs, {
          color: cor, weight: 5, opacity: 0.8
        }).addTo(mapa);
        camadasAlternativas.push(linha);

        // Botao HTML em vez de clicar na linha -- evita o problema
        // de eventos de clique em SVG (polylines) nao funcionarem
        // de forma fiavel em Android WebView
        var km = alt.distanciaMetros ? (alt.distanciaMetros / 1000).toFixed(1) + ' km' : '';
        var btn = document.createElement('button');
        btn.className = 'btn-alt';
        btn.style.background = cor;
        btn.textContent = 'Rota ' + (indice + 1) + (km ? '  ' + km : '');
        btn.addEventListener('click', function () { escolheAlternativa(indice); });
        container.appendChild(btn);
      });

      if (todosPontos.length > 0) {
        mapa.fitBounds(todosPontos, { padding: [40, 40] });
      }
    }

    function defineTrajetoExistente(jsonTexto, jsonOrigem, jsonDestino) {
      limpaAlternativas();
      if (marcadorOrigem) { mapa.removeLayer(marcadorOrigem); marcadorOrigem = null; }
      if (marcadorDestino) { mapa.removeLayer(marcadorDestino); marcadorDestino = null; }
      var pontos;
      try { pontos = JSON.parse(jsonTexto); } catch (e) { return; }
      if (!pontos || pontos.length < 2) return;
      var latLngs = pontos.map(function (p) { return [p.lat, p.lon]; });
      var linha = L.polyline(latLngs, { color: '#2BA6E0', weight: 5, opacity: 0.9 }).addTo(mapa);
      camadasAlternativas.push(linha);
      var pOrigem = (jsonOrigem && jsonOrigem !== 'null') ? JSON.parse(jsonOrigem) : pontos[0];
      var pDestino = (jsonDestino && jsonDestino !== 'null') ? JSON.parse(jsonDestino) : pontos[pontos.length - 1];
      marcadorOrigem = L.marker([pOrigem.lat, pOrigem.lon], { icon: ICONE_ORIGEM }).addTo(mapa);
      marcadorDestino = L.marker([pDestino.lat, pDestino.lon], { icon: ICONE_DESTINO }).addTo(mapa);
      mapa.fitBounds(latLngs, { padding: [30, 30], maxZoom: 16 });
    }

    function marcaAlternativaSelecionada(indice) {
      camadasAlternativas.forEach(function (linha, i) {
        linha.setStyle({ weight: i === indice ? 8 : 4, opacity: i === indice ? 1.0 : 0.4 });
      });
    }

    // Captura de toques no mapa para marcar origem/destino --
    // usando addEventListener nativo no container (mais fiavel em
    // Android WebView do que mapa.on('click',...))
    var container = mapa.getContainer();

    function processaToque(event) {
      // ignorar toques nos botoes de alternativa
      if (event.target && event.target.closest && event.target.closest('#botoes-alternativas')) return;
      var rect = container.getBoundingClientRect();
      var toque = event.touches ? event.touches[0] : event;
      var x = toque.clientX - rect.left;
      var y = toque.clientY - rect.top;
      var latlng = mapa.containerPointToLatLng(L.point(x, y));

      if (!marcadorOrigem) {
        marcadorOrigem = L.marker(latlng, { icon: ICONE_ORIGEM }).addTo(mapa);
      } else if (!marcadorDestino) {
        marcadorDestino = L.marker(latlng, { icon: ICONE_DESTINO }).addTo(mapa);
      } else {
        // terceiro toque: reinicia
        if (marcadorOrigem) { mapa.removeLayer(marcadorOrigem); }
        if (marcadorDestino) { mapa.removeLayer(marcadorDestino); }
        limpaAlternativas();
        marcadorOrigem = L.marker(latlng, { icon: ICONE_ORIGEM }).addTo(mapa);
        marcadorDestino = null;
      }

      var payload = {
        origem: marcadorOrigem ? { lat: marcadorOrigem.getLatLng().lat, lon: marcadorOrigem.getLatLng().lng } : null,
        destino: marcadorDestino ? { lat: marcadorDestino.getLatLng().lat, lon: marcadorDestino.getLatLng().lng } : null
      };
      window.location.href = 'blugateway-rota://pontos?dados=' + encodeURIComponent(JSON.stringify(payload));
    }

    container.addEventListener('click', processaToque);
  </script>
</body>
</html>
