<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="leaflet.css" />
  <style>
    html, body, #mapa { height: 100%; margin: 0; padding: 0; background: #0D1117; }
    .leaflet-control-attribution { font-size: 9px; }
  </style>
</head>
<body>
  <div id="mapa"></div>
  <script src="leaflet.js"></script>
  <script>
    // Mapa comeca centrado num ponto neutro (0,0) ate a app chamar
    // desenhaTrajetos() com os dados reais -- evita depender de
    // localizacao disponivel so para ABRIR o mapa.
    var mapa = L.map('mapa', { zoomControl: true }).setView([0, 0], 2);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(mapa);

    var camadasAtuais = [];

    /**
     * Recebe um JSON com a forma:
     * [{ "nome": "SBBT-002C", "cor": "#2BA6E0", "pontos": [{"lat":38.7,"lon":-9.1,"timestamp":123}, ...] }, ...]
     * Chamado pela app Android via evaluateJavascript depois da pagina
     * ja estar carregada -- nao no HTML inicial, para nao ter de
     * escapar strings grandes/dinamicas dentro do proprio HTML.
     */
    function desenhaTrajetos(jsonTexto) {
      camadasAtuais.forEach(function (camada) { mapa.removeLayer(camada); });
      camadasAtuais = [];

      var dados;
      try {
        dados = JSON.parse(jsonTexto);
      } catch (e) {
        return;
      }

      var todosPontos = [];

      dados.forEach(function (comando) {
        if (!comando.pontos || comando.pontos.length === 0) return;

        var latLngs = comando.pontos.map(function (p) { return [p.lat, p.lon]; });
        todosPontos = todosPontos.concat(latLngs);

        var linha = L.polyline(latLngs, { color: comando.cor, weight: 3, opacity: 0.75 }).addTo(mapa);
        camadasAtuais.push(linha);

        var ultimo = comando.pontos[comando.pontos.length - 1];
        var marcador = L.circleMarker([ultimo.lat, ultimo.lon], {
          radius: 8,
          color: comando.cor,
          fillColor: comando.cor,
          fillOpacity: 0.9,
          weight: 2
        }).addTo(mapa);
        marcador.bindPopup(comando.nome);
        camadasAtuais.push(marcador);
      });

      if (todosPontos.length > 0) {
        mapa.fitBounds(todosPontos, { padding: [30, 30], maxZoom: 16 });
      }
    }
  </script>
</body>
</html>
